<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Sign in · SmartStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static',filename='style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-icon">S</span>
      <div>SmartStock<small>INVENTORY INTELLIGENCE</small></div>
    </div>
    <h1>Welcome back</h1>
    <p class="login-intro">Sign in to continue to your inventory.</p>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-control" autocomplete="username" required maxlength="80" autofocus>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="login-footnote">Accounts are created by an authorized system owner.</p>
  </main>
</body>
</html>
